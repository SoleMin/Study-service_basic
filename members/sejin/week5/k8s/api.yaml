apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: week2-api:0.1
          imagePullPolicy: IfNotPresent # 노드에 있으면 받지 않음 (kind load한 이미지용)
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: week2-secret
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0 # compose와 같은 주소. Service 이름 redis
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"] # 명단에서 빠질 시간을 줌
          readinessProbe: # compose healthcheck에 해당
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000 # 손님은 80, uvicorn은 8000
