apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx          # (B) 관리할 Pod 찾는 조건
  template:
    metadata:
      labels:
        app: nginx        # (C) Pod에 붙일 스티커 — (B)와 같아야 함
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx            # (G) 요청 보낼 Pod 찾는 조건 — (C)와 같아야 함
  ports:
    - port: 80
      targetPort: 80