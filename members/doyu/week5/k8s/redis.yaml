# 2주차 compose의 redis 서비스를 k8s로 옮긴 것
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
# Service 이름이 곧 DNS 이름: api Pod는 REDIS_HOST=redis 로 찾는다 (compose의 서비스 이름과 같은 역할)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: study
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
