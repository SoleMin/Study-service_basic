# Deployment: "nginx Pod를 항상 2개 유지해" 라는 원하는 상태
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: study
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx            # 이 라벨이 붙은 Pod를 내 것으로 센다
  template:                 # 새로 만들 Pod의 설계도
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
# Service: Pod가 죽고 다시 떠서 IP가 바뀌어도 변하지 않는 이름과 주소
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: study
spec:
  selector:
    app: nginx              # 이 라벨의 Pod들로 요청을 나눠 보낸다
  ports:
    - port: 80
      targetPort: 80
