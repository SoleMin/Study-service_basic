# 2주차 FastAPI(/chat + Redis 캐시)를 k8s로
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: study
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: doyu-week2-api:1.0
          imagePullPolicy: IfNotPresent   # kind load로 넣은 로컬 이미지를 쓴다 (Always면 Docker Hub에서 찾다 실패)
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
            - name: CACHE_TTL
              value: "3600"
            - name: FAKE_LLM_DELAY
              value: "2.0"
          readinessProbe:                 # /health가 200을 줄 때만 Service가 이 Pod로 요청을 보낸다
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
          lifecycle:
            preStop:                      # 종료 신호를 받아도 5초 더 버틴다: Service 목록에서 빠지는 동안 들어오는 요청을 받아 주려고
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: study
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
